# LOCAL DEVELOPMENT ONLY. Mounting a host Docker socket grants the worker
# root-equivalent access to the host. Never use this overlay on a shared host.
services:
  worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets LLM_BASE_URL=http://host.docker.internal:<port>/v1 reach a model server on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
