[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-testing-agent"
version = "1.0.0"
description = "Bounded AI-driven pytest investigation with Docker isolation and evidence reports"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "openai>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<7",
  "alembic>=1.13,<2",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["S101"]
